<!doctype html>
<html lang="pt-PT"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a2ee0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="공부방">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>공부방 Coreano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: phone-first app. Purple hero on top, one view at a time, fixed bottom tab bar.
   Lessons are colour-coded with the four dancheong pigments (jade, vermilion, ochre, cobalt). */
:root{
  --bg:#f6f4fa; --surface:#fbfafd; --raised:#ffffff; --ink:#1d1a24; --muted:#625e6d; --line:#e2dfea;
  --jade:#1d6b58; --jade-soft:#dcebe5; --red:#bf3b28; --red-soft:#f6e1dc; --ochre:#b97c12; --ochre-soft:#f5ead2;
  --cobalt:#2b4f9b; --cobalt-soft:#dfe6f4; --ok:#1d7a4a; --bad:#bf3b28;
  --hero-a:#6a2ee0; --hero-b:#7444e0; --hero-c:#7b52ea; --on-hero:#ffffff; --accent-ink:#6d3fd8;
  --display:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121018; --surface:#18161f; --raised:#1e1b26; --ink:#ebe8f0; --muted:#a19cad; --line:#2c2836;
  --jade:#62c3a7; --jade-soft:#1c3530; --red:#f08068; --red-soft:#3a201b; --ochre:#e6b453; --ochre-soft:#382c15;
  --cobalt:#8eabef; --cobalt-soft:#1f2a42; --ok:#5fd093; --bad:#f08068;
  --hero-a:#4c1fb0; --hero-b:#6d3fd8; --hero-c:#6e4ad4; --accent-ink:#b9a3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121018; --surface:#18161f; --raised:#1e1b26; --ink:#ebe8f0; --muted:#a19cad; --line:#2c2836;
  --jade:#62c3a7; --jade-soft:#1c3530; --red:#f08068; --red-soft:#3a201b; --ochre:#e6b453; --ochre-soft:#382c15;
  --cobalt:#8eabef; --cobalt-soft:#1f2a42; --ok:#5fd093; --bad:#f08068;
  --hero-a:#4c1fb0; --hero-b:#6d3fd8; --hero-c:#6e4ad4; --accent-ink:#b9a3ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:10px}

.stripe{display:none}
.app{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}

/* type */
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}
h1.title{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
h1.title small{display:block;font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:4px}
h2{font-family:var(--display);font-size:21px;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.ko{font-family:var(--display)}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);color:var(--on-hero);border-radius:24px;padding:22px 20px 20px}
.hero .big{position:relative;font-family:var(--display);font-size:52px;line-height:1;font-weight:700}
.hero p{position:relative;margin:8px 0 0;opacity:.9}
.hero .seal{position:absolute;right:-6px;top:-34px;font-family:var(--display);font-size:170px;font-weight:700;line-height:1;color:var(--on-hero);opacity:.12;pointer-events:none}
.hero .seal::after{content:"한"}
.hero .stats{position:relative;display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.hero .stats div{font-size:12px;opacity:.9}
.hero .stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;opacity:1}

/* cards */
.card{background:var(--raised);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--raised);text-decoration:none;color:inherit;min-height:118px}
.tile .glyph{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.tile .lbl{font-weight:700}
.tile .sub{font-size:12px;color:var(--muted);margin-top:auto}
.c-jade{--c:var(--jade);--cs:var(--jade-soft)} .c-red{--c:var(--red);--cs:var(--red-soft)}
.c-ochre{--c:var(--ochre);--cs:var(--ochre-soft)} .c-cobalt{--c:var(--cobalt);--cs:var(--cobalt-soft)}
.tile .glyph,.accent{color:var(--c)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.wotd{display:flex;align-items:center;gap:14px}
.wotd .w{font-family:var(--display);font-size:30px;font-weight:700}

/* chips & segmented */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--c,var(--jade));border-color:var(--c,var(--jade));color:var(--raised)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--jade);color:var(--raised)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.icon{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--jade)}
.icon svg{width:20px;height:20px}
.icon.lg{width:84px;height:84px;background:var(--jade);border:0;color:var(--raised)}
.icon.lg svg{width:38px;height:38px}

/* grammar */
.lesson-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lesson-head .n{font-family:var(--display);font-size:30px;font-weight:700;color:var(--c)}
.gcard{border-left:4px solid var(--c);border-radius:16px;background:var(--raised);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.gcard summary{list-style:none;padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.gcard summary::-webkit-details-marker{display:none}
.gcard .form{font-family:var(--display);font-size:22px;font-weight:700}
.gcard .mean{color:var(--muted);font-size:14px}
.gbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.gbody ul{margin:0;padding-left:18px}
.gbody li{margin:2px 0}
.ex{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:12px;padding:10px 12px}
.ex .t{flex:1;min-width:0}
.ex .k{font-family:var(--display);font-size:17px;font-weight:700}
.ex .p{font-size:13px;color:var(--muted)}
.ex .icon{width:34px;height:34px}
.tip{background:var(--cs);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td:first-child{font-family:var(--display);font-weight:700}

/* vocab */
.deck{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--raised)}
.deck .k{font-family:var(--display);font-weight:700;font-size:18px;color:var(--c)}
.deck .meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.deck .meter i{display:block;height:100%;background:var(--c)}
.flash{perspective:1200px}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--raised);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.flash .back{transform:rotateY(180deg);background:var(--cs);border-color:transparent}
.flash .w{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.flash .pt{font-size:22px;font-weight:500;overflow-wrap:anywhere}
.flash .hint{font-size:12px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:13px 14px;font-weight:500}
.opt.ko{font-family:var(--display);font-size:19px;font-weight:700}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--raised))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--raised))}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--jade));transition:width .3s}

/* writing & listening */
.prompt{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.3}
.prompt .plus{color:var(--muted);font-family:var(--body);font-weight:500;font-size:18px}
input.ans,textarea.ans{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;font-family:var(--display);font-size:20px}
textarea.ans{min-height:110px;resize:vertical;font-size:17px}
input.ans:focus,textarea.ans:focus{outline:none;border-color:var(--jade)}
.fb{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:color-mix(in srgb,var(--ok) 13%,var(--raised));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 11%,var(--raised));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.fb.info{background:var(--surface);border:1px solid var(--line)}
.fb .k{font-family:var(--display);font-size:18px;font-weight:700}
.fb ul{margin:0;padding-left:18px}
.score{font-variant-numeric:tabular-nums;font-weight:700}
select.sel{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:8px 10px;max-width:100%}
.player{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--jade);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* teacher */
.tq{background:var(--raised);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tq .head{padding:12px 14px 6px}
.tq .head b{font-family:var(--display);font-size:19px}
.tq .head small{display:block;color:var(--muted);font-size:13px}
.tq .r{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.tq .r a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.tag{font-size:12px;font-weight:700;border-radius:7px;padding:2px 8px;background:var(--jade-soft);color:var(--jade)}
.tag.h{background:var(--ochre-soft);color:var(--ochre)}
.chk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;display:grid;place-items:center;font-size:14px}
.tq .r.done .chk{background:var(--jade);border-color:var(--jade);color:var(--raised)}
.tq .r.done .d{text-decoration:line-through;color:var(--muted)}
.tq .r.miss{color:var(--muted);font-size:13px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
nav.tabs a .ti{width:48px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
nav.tabs a .ti svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);font-weight:700}
nav.tabs a[aria-current="page"] .ti{background:color-mix(in srgb,var(--hero-b) 16%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- v4 additions ---- */
.countdown{display:flex;align-items:center;gap:14px}
.countdown .days{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.countdown input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;max-width:100%}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.goal{display:flex;flex-direction:column;gap:4px;font-size:13px}
.goal .top{display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums}
.goal .top b{font-weight:500}
.goal.met .top span{color:var(--ok);font-weight:700}
.streak{display:flex;align-items:center;gap:8px;font-size:14px}
.streak .dots{display:flex;gap:4px}
.streak .dots i{width:10px;height:10px;border-radius:3px;background:var(--line)}
.streak .dots i.on{background:var(--ochre)}
.errlink{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.errlink .num{font-family:var(--display);font-size:30px;font-weight:700;color:var(--red);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
.examq{display:flex;flex-direction:column;gap:14px}
.qnum{display:flex;align-items:center;gap:10px}
.qnum .sec{font-size:12px;font-weight:700;border-radius:7px;padding:3px 9px;background:var(--cobalt-soft);color:var(--cobalt)}
.qnum .sec.r{background:var(--ochre-soft);color:var(--ochre)}
.timer{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--red);transform-origin:left;transition:transform 1s linear}
.stem{font-weight:700;font-size:15px}
.sentence{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.45}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--ink);text-align:center;color:var(--muted)}
.passage{font-family:var(--display);font-size:17px;line-height:1.85;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.opt .no{display:inline-block;width:1.6em;color:var(--muted);font-family:var(--body)}
.plays{font-size:12px;color:var(--muted)}
.result{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:22px 16px}
.result .pts{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;color:var(--jade);font-variant-numeric:tabular-nums}
.splits{display:flex;gap:18px;justify-content:center;margin-top:8px;font-size:13px;color:var(--muted)}
.splits b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:6px;height:90px;padding-top:6px}
.hist .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.hist .b i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--jade)}
.hist .b:last-child i{background:var(--red)}
.rev{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rev .ko{font-size:16px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.bub.them{align-self:flex-start;background:var(--raised);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--jade);color:var(--raised);border-bottom-right-radius:6px}
.bub .k{font-family:var(--display);font-size:17px;font-weight:700;overflow-wrap:anywhere}
.bub .t{font-size:13px;color:var(--muted)}
.bub .tools{display:flex;gap:6px}
.bub .tools button{border:0;background:none;color:var(--jade);font-size:12px;font-weight:700;padding:2px 0}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;min-height:48px;max-height:140px;font-size:17px}
.scen{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--raised)}
.scen b{font-weight:700}
.scen span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:12px;font-size:14px}
.li .ko{font-weight:700;font-size:16px}
.li .n{margin-left:auto;font-size:12px;color:var(--red);font-weight:700;flex:none}
.today{display:flex;flex-direction:column;gap:12px}
.today .nt{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.25;text-wrap:balance}
.btn.cont{width:100%;padding:15px 16px;font-size:16px;background:var(--hero-a);color:var(--on-hero)}
/* home v7 */
.home-hero{display:flex;flex-direction:column;gap:16px;padding:20px}
.hhead{position:relative;display:flex;align-items:flex-start;gap:12px}
.hhead>div:first-child{flex:1;min-width:0}
.hello{font-size:13px;opacity:.85;font-weight:500}
.home-hero .big{font-size:44px}
.home-hero p{margin:4px 0 0;font-size:13px}
.flame{display:flex;align-items:center;gap:4px;background:rgb(255 255 255 / .18);border-radius:99px;padding:6px 12px 6px 9px;font-variant-numeric:tabular-nums}
.flame svg{width:18px;height:18px;color:#ffd27a}
.flame b{font-size:16px}
.htoday{position:relative;display:flex;align-items:center;gap:14px;background:rgb(255 255 255 / .14);border-radius:18px;padding:12px 14px}
.ring{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .rbg{stroke:rgb(255 255 255 / .25)}

function ttsRun(items,o={}){
  const user=o.user??(Date.now()-lastTap<1500), retry=!!o.retry, id=++ttsRunId;
  if(!hasTTS()){if(user)ttsHelp("none");return}
  const ss=speechSynthesis, kv=koVoices(), plain=ttsPlain||retry;
  let busy=false; try{busy=ss.speaking||ss.pending;if(busy)ss.cancel();ss.resume()}catch(e){}
  let started=false, failed=false; clearTimeout(ttsWatch);
  const again=reason=>{if(failed||id!==ttsRunId)return;failed=true;clearTimeout(ttsWatch);
    if(!retry){setTimeout(()=>{if(id===ttsRunId)ttsRun(items,{user,retry:true})},250);return}
    if(user)ttsHelp(reason==="language-unavailable"||reason==="voice-unavailable"?"novoice":reason==="not-allowed"?"silent":reason==="nostart"?(voices.length&&!kv.length?"novoice":"silent"):"error",reason==="nostart"?"":reason)};
  const go=()=>{
    if(id!==ttsRunId)return;
    try{
      curU=items.map(([t,slow,who])=>{const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";const m=who==="남";
        if(!plain&&kv.length)u.voice=who&&kv.length>1?kv[m?0:1]:kv[0];

        u.onerror=e=>{if(e.error==="canceled"||e.error==="interrupted")return;again(e.error)};
        return u});

    }catch(e){again(e.message);return}
    ttsWatch=setTimeout(()=>{if(!started&&!ss.speaking&&id===ttsRunId)again("nostart")},2500);

}

/* ============ PRONÚNCIA (발음): spelling → how it is read, with the rule that changed it ============ */
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const decS=ch=>{const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>11171)return null;return {L:CHO[Math.floor(c/588)],V:Math.floor(c%588/28),T:JONG[c%28]}};
const encS=s=>String.fromCharCode(0xAC00+(CHO.indexOf(s.L)*21+s.V)*28+JONG.indexOf(s.T));
const SPLIT={"ㄳ":["ㄱ","ㅅ"],"ㄵ":["ㄴ","ㅈ"],"ㄶ":["ㄴ","ㅎ"],"ㄺ":["ㄹ","ㄱ"],"ㄻ":["ㄹ","ㅁ"],"ㄼ":["ㄹ","ㅂ"],"ㄽ":["ㄹ","ㅅ"],"ㄾ":["ㄹ","ㅌ"],"ㄿ":["ㄹ","ㅍ"],"ㅀ":["ㄹ","ㅎ"],"ㅄ":["ㅂ","ㅅ"]};
const REP={"ㄲ":"ㄱ","ㅋ":"ㄱ","ㄳ":"ㄱ","ㄺ":"ㄱ","ㅅ":"ㄷ","ㅆ":"ㄷ","ㅈ":"ㄷ","ㅊ":"ㄷ","ㅌ":"ㄷ","ㅎ":"ㄷ","ㅍ":"ㅂ","ㅄ":"ㅂ","ㄿ":"ㅂ","ㄵ":"ㄴ","ㄶ":"ㄴ","ㄼ":"ㄹ","ㄽ":"ㄹ","ㄾ":"ㄹ","ㅀ":"ㄹ","ㄻ":"ㅁ"};
const TENSE={"ㄱ":"ㄲ","ㄷ":"ㄸ","ㅂ":"ㅃ","ㅅ":"ㅆ","ㅈ":"ㅉ"}, ASP={"ㄱ":"ㅋ","ㄷ":"ㅌ","ㅂ":"ㅍ","ㅈ":"ㅊ"}, NAS={"ㄱ":"ㅇ","ㄷ":"ㄴ","ㅂ":"ㅁ"};
const PRON_RULE={
  link:"Ligação: o 받침 passa para a sílaba seguinte, que começa por ㅇ.",
  hdrop:"O ㅎ do 받침 não se lê antes de vogal nem de ㄴ.",
  asp:"ㅎ junta-se à consoante ao lado: ㄱ/ㄷ/ㅂ/ㅈ + ㅎ → ㅋ/ㅌ/ㅍ/ㅊ.",
  palat:"ㄷ/ㅌ antes de 이 lê-se ㅈ/ㅊ.",
  nasal:"ㄱ/ㄷ/ㅂ antes de ㄴ/ㅁ lêem-se ㅇ/ㄴ/ㅁ.",
  rl:"ㄹ depois de ㅁ/ㅇ/ㄱ/ㅂ lê-se ㄴ.",
  liquid:"ㄴ e ㄹ juntos lêem-se ㄹㄹ.",
  tense:"Depois de ㄱ/ㄷ/ㅂ (e no fim de alguns verbos), ㄱ/ㄷ/ㅂ/ㅅ/ㅈ ficam tensas: ㄲ/ㄸ/ㅃ/ㅆ/ㅉ.",
  double:"받침 duplo: só se lê uma das duas consoantes.",
  final:"No fim da sílaba, ㅅ/ㅆ/ㅈ/ㅊ/ㅌ lêem-se [ㄷ], ㅋ/ㄲ [ㄱ] e ㅍ [ㅂ]."};
function pronWord(w){
  const sy=[...w].map(ch=>decS(ch)||{raw:ch}); const R=new Set();
  const verbEnd=w.endsWith("다"); // only one-syllable stems (신다, 앉다, 넓다); 베란다 is a noun
  for(let i=0;i<sy.length-1;i++){
    const a=sy[i], b=sy[i+1]; if(a.raw||b.raw||!a.T)continue;
    const T=a.T;
    if(T==="ㅎ"||T==="ㄶ"||T==="ㅀ"){
      const keep=T==="ㅎ"?"":SPLIT[T][0];
      if(ASP[b.L]){b.L=ASP[b.L];a.T=keep;R.add("asp");continue}
      if(b.L==="ㅅ"){b.L="ㅆ";a.T=keep;R.add("tense");continue}
      if(b.L==="ㅇ"){a.T="";if(keep){b.L=keep;R.add("link")}R.add("hdrop");continue}
      if(b.L==="ㄴ"){a.T=keep||"ㄴ";R.add(keep?"hdrop":"nasal");continue}
    }
    if(b.L==="ㅎ"){const base=SPLIT[T]||["",T];const c=REP[base[1]]||base[1];
      if(ASP[c]){b.L=ASP[c];a.T=base[0];R.add("asp");continue}}
    if((T==="ㄷ"||T==="ㅌ")&&b.L==="ㅇ"&&b.V===20){b.L=T==="ㄷ"?"ㅈ":"ㅊ";a.T="";R.add("palat");continue}
    if(b.L==="ㅇ"){
      if(T==="ㅇ")continue;
      if(SPLIT[T]){a.T=SPLIT[T][0];b.L=SPLIT[T][1]==="ㅅ"?"ㅆ":SPLIT[T][1]}else{a.T="";b.L=T}
      R.add("link");continue;
    }
    let t;
    if(T==="ㄺ"&&b.L==="ㄱ"){t="ㄹ";b.L="ㄲ";R.add("double");R.add("tense");a.T=t;continue}
    if(T==="ㄼ"&&a.L==="ㅂ"&&a.V===0)t="ㅂ"; else t=REP[T]||T;
    if(t!==T)R.add(SPLIT[T]?"double":"final");
    if(b.L==="ㄹ"&&["ㅁ","ㅇ","ㄱ","ㄷ","ㅂ"].includes(t)){b.L="ㄴ";R.add("rl")}
    if((b.L==="ㄴ"||b.L==="ㅁ")&&NAS[t]){t=NAS[t];R.add("nasal")}
    else if(t==="ㄴ"&&b.L==="ㄹ"){t="ㄹ";R.add("liquid")}
    else if(t==="ㄹ"&&b.L==="ㄴ"){b.L="ㄹ";R.add("liquid")}
    else if(NAS[t]&&TENSE[b.L]){b.L=TENSE[b.L];R.add("tense")}
    else if(verbEnd&&sy.length===2&&i===0&&b.L==="ㄷ"&&["ㄴ","ㅁ","ㄵ","ㄻ","ㄼ","ㄾ"].includes(T)){b.L="ㄸ";R.add("tense")}
    a.T=t;
  }
  const z=sy[sy.length-1];
  if(z&&!z.raw&&z.T&&REP[z.T]){R.add(SPLIT[z.T]?"double":"final");z.T=REP[z.T]}
  return {p:sy.map(s=>s.raw||encS(s)).join(""),R};
}
function pron(text){
  const parts=String(text).split(/(\s+)/).map(x=>/\s/.test(x)||!x?{p:x,R:new Set()}:pronWord(x));
  const p=parts.map(x=>x.p).join(""); if(p===text)return null;
  const R=new Set(parts.flatMap(x=>[...x.R]));
  if(R.size>1)R.delete("final");
  return {p,rules:[...R].slice(0,2).map(k=>PRON_RULE[k])};
}
const pronHTML=t=>{const r=pron(t);return r?`<div class="pron"><b>[${esc(r.p)}]</b> ${r.rules.map(esc).join(" ")}</div>`:""};

// Drag a card left/right; a short tap still counts as a tap.
function swipeable(el,{left,right,tap}){
  let x0=null,y0=0,dx=0,moved=false;
  el.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;dx=0;moved=false;el.classList.add("dragging");try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;const dy=e.clientY-y0;
    if(!moved&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))moved=true;
    if(moved){el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;el.dataset.dir=dx>50?"r":dx<-50?"l":""}});
  el.addEventListener("pointerup",()=>{if(x0===null)return;x0=null;el.classList.remove("dragging");
    if(moved&&Math.abs(dx)>90){const d=dx;el.style.transform=`translateX(${d>0?700:-700}px) rotate(${d/12}deg)`;setTimeout(()=>(d>0?right:left)(),200)}
    else{el.style.transform="";el.dataset.dir="";if(!moved&&tap)tap()}});
  el.addEventListener("pointercancel",()=>{x0=null;el.classList.remove("dragging");el.style.transform="";el.dataset.dir=""});
}

// Mark, syllable by syllable, what differs between what the learner wrote and the right sentence.
function diffHTML(mine,right){
  const A=[...mine.normalize("NFC")],B=[...right.normalize("NFC")];
  const sk=c=>/[\s.?!,~·'"“”]/.test(c);
  const ai=A.map((_,i)=>i).filter(i=>!sk(A[i])), bi=B.map((_,i)=>i).filter(i=>!sk(B[i]));
  const n=ai.length,m=bi.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let x=n-1;x>=0;x--)for(let y=m-1;y>=0;y--)dp[x][y]=A[ai[x]]===B[bi[y]]?dp[x+1][y+1]+1:Math.max(dp[x+1][y],dp[x][y+1]);
  const okA=new Set(),okB=new Set();let x=0,y=0;
  while(x<n&&y<m){if(A[ai[x]]===B[bi[y]]){okA.add(ai[x]);okB.add(bi[y]);x++;y++}else if(dp[x+1][y]>=dp[x][y+1])x++;else y++}
  const paint=(arr,ok)=>{let out="",bad=false;arr.forEach((c,i)=>{const b=!sk(c)&&!ok.has(i);if(b!==bad){out+=b?'<b class="bad">':"</b>";bad=b}out+=esc(c)});return out+(bad?"</b>":"")};
  return {mine:paint(A,okA),right:paint(B,okB)};
}

// A grade only counts when Claude actually returned a number.
const hasNota=r=>!!r&&r.nota!==null&&r.nota!==""&&Number.isFinite(+r.nota);
function evalHTML(r,text){
  const nota=Math.max(0,Math.min(100,Math.round(+r.nota||0)));
  const pr=Array.isArray(r.pronuncia)?r.pronuncia.filter(x=>x&&x.ouvido):[];
  return `<div class="fb ${nota>=60?"ok":"no"}"><div class="row"><span class="ko" style="font-size:34px;font-weight:700;color:${nota>=60?"var(--ok)":"var(--ochre)"}">${nota}</span><span class="grow">${esc(r.elogio||"")}</span></div>
    ${r.corrigido&&norm(r.corrigido)!==norm(text)?`<div class="row"><span class="k grow">${esc(r.corrigido)}</span>${say(r.corrigido)}</div>`:""}
    ${pr.length?`<div><b>Pronúncia</b><ul>${pr.map(x=>`<li><span class="ko">${esc(x.ouvido)}</span> → <span class="ko">${esc(x.provavel||"")}</span>: ${esc(x.dica||"")}</li>`).join("")}</ul></div>`:""}
    ${Array.isArray(r.notas)&&r.notas.length?`<ul>${r.notas.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>`;
}
function oralEval(box,q,text){
  box.innerHTML=`<div class="fb info"><span><span class="spin"></span> A avaliar a tua resposta…</span></div>`;
  getSample().then(sample=>{
    if(!sample){bump("c");box.innerHTML=localCheckHTML(text,{model:q[3],range:[1,3]});return}
    const prompt=`És examinador do 말하기 do 성취도 평가 do 세종학당 (nível 2A). A aluna é portuguesa.
Pergunta: "${q[1]}" (${q[2]}). Resposta-modelo: "${q[3]}".
A aluna respondeu em voz alta. O texto seguinte é o que o reconhecimento de voz do telemóvel percebeu; palavras estranhas ou trocadas costumam indicar problemas de pronúncia:
"""${text}"""
Avalia de 0 a 100: se responde à pergunta, gramática e vocabulário de 2A, e pronúncia (deduzida do reconhecimento). Sê encorajador e conciso, em português de Portugal. Responde só com JSON:
{"nota":número,"corrigido":"a resposta corrigida e natural em coreano","pronuncia":[{"ouvido":"palavra reconhecida","provavel":"palavra que querias dizer","dica":"dica curta de pronúncia"}],"notas":["até 3 observações curtas"],"elogio":"frase curta"}
Se a pronúncia parecer boa, "pronuncia" fica vazio.`;
    return sample.json(prompt,{modelTier:"default",cache:false}).then(r=>{if(!hasNota(r))throw {code:"bad"};bump("c");box.innerHTML=evalHTML(r,text)});

// One "back" for every screen: closes the innermost thing first, then returns to Início.
function goBack(){
  const h=(location.hash||"#home").slice(1);
  if(h==="exame"&&EX.live){toast("Para sair do exame, carrega em <b>Sair</b>.");return}
  if(h==="exame"&&!$("#ex-full4")){clearInterval(EX.timer);exame();return}
  if(h==="vocab"&&S.deck){S.deck=null;vocab();return}
  if(h==="pratica"){
    if(S.read){S.read=null;pratica();return}
    if(CH){S.scen=null;CH=null;pratica();return}
    if(OR){clearInterval(EX.timer);OR=null;pratica();return}
  }
  if(h!=="home"&&h!=="")go("home");
}

  const ve=errKeys("v:").length, ce=errKeys("c:").length;
  const meta={
    v:{label:r=>`Aprender ${r} palavra${r>1?"s":""}`, sub:()=>ve?`Começa pelas ${ve} que falhaste`:`Tema: ${nextDeck().pt}`,
       go:()=>{if(ve){S.deck="err";S.vmode="quiz"}else{S.deck=nextDeck().id;S.vmode="cards"}go("vocab")}},
    c:{label:r=>`Fazer ${r} conjugaç${r>1?"ões":"ão"}`, sub:()=>ce?`Começa pelas ${ce} que falhaste`:"Todas as lições",
       go:()=>{S.psub="escrita";S.wmode="conj";S.drillG=ce?"err":"all";go("pratica")}},
    l:{label:r=>`Ouvir ${r} frase${r>1?"s":""}`, sub:()=>"Ouves e escolhes o que quer dizer",
       go:()=>{S.psub="audicao";S.lmode="comp";go("pratica")}},

       go:()=>{S.autoMini=true;go("exame")}}};

const DRILL_L={L1:["-(이)라고 하다","-는 + 음식","-는 + 도시","-는 + 일"],L2:["-(이)나","-(으)ㄹ까요?"],L3:["마다","-(으)ㄹ 때"],L4:["-아/어 보여요"],L5:["-기가 편해요","-기가 어려워요","-지 않아요"],L6:["-(으)면서","-기 전에","-(으)ㄴ 후에"],L7:["-(으)면","-아/어요 (ㅅ)","-았/었어요 (ㅅ)","-(으)면 (ㅅ)","-(으)ㄹ 거예요 (ㅅ)","-아/어요 (ㅅ?)","-지요?"],L8:["-는데","-아/어 보세요","-지 않는 게 좋아요"]};

}

  dg.onchange=e=>{S.drillG=e.target.value;wConj()};

/* ============ 쓰기: correção automática (funciona sem o Claude) ============ */
// Verbs known to the app, to recognise forms like 먹는 / 사는 (-는 modifier).
const VERBS=new Set([...DECKS.flatMap(d=>d.w.map(w=>w[0].split(" ").pop())),...DRILLS.map(d=>d[1]),
  ..."하다 먹다 살다 일하다 만들다 좋아하다 다니다 가르치다 팔다 배우다 읽다 쓰다 마시다 듣다 보다 가다 오다 자다 타다 입다 있다 없다 알다 놀다 걷다 공부하다 운동하다 일어나다 만나다 사다 앉다 웃다 울다 찾다 기다리다 전화하다 요리하다".split(" ")].filter(v=>v.endsWith("다")));
const jongOf=ch=>{const c=(ch||"").charCodeAt(0)-0xAC00;return c<0||c>11171?-1:c%28};
const addRieul=s=>{const c=s.charCodeAt(s.length-1)-0xAC00;return c>=0&&c%28===0?s.slice(0,-1)+String.fromCharCode(s.charCodeAt(s.length-1)+8):null};
const isVerbStem=st=>VERBS.has(st+"다")||(!!addRieul(st)&&VERBS.has(addRieul(st)+"다"));
const kWords=t=>t.split(/\s+/).map(w=>w.replace(/[.,?!"'“”()~·:…]/g,"")).filter(Boolean);
// What each grammar point looks like in a learner's sentence.
const GDET={
  "라고":t=>/라고\s*(해|합|했|하)/.test(t),
  "는":t=>kWords(t).some((w,i,a)=>i<a.length-1&&w.length>1&&w.endsWith("는")&&isVerbStem(w.slice(0,-1))),
  "거나":t=>/거나/.test(t),

function particleIssues(text){

    else if(w.endsWith("은")&&J(1)===0)fix(1,"는","depois de vogal usa-se 는");
    else if(w.endsWith("와")&&w.length>2&&J(1)>0)fix(1,"과","depois de consoante usa-se 과");
    else if(w.endsWith("이라고")&&w.length>3&&J(3)===0)fix(3,"라고","depois de vogal: 라고");

function analyseWriting(text,o={}){

function claudeFeedback(box,task,text,model,o={}){
  const local=()=>localCheckHTML(text,{model,grammar:o.grammar,range:o.range});
  box.innerHTML=`<div class="fb info"><span><span class="spin"></span> A corrigir…</span></div>`;
  getSample().then(sample=>{
    if(!sample){bump("c");box.innerHTML=local();return}
    const prompt=`És professor de coreano. A aluna é portuguesa (PT-PT), nível 세종한국어 2A.
Tarefa: ${task}
${model?`Resposta modelo (há outras corretas): ${model}`:""}
Texto da aluna: """${text}"""
Avalia gramática, ortografia, partículas e naturalidade, ao nível 2A. Sê encorajador e conciso. Responde só com JSON:
{"correto": true ou false, "corrigido": "texto corrigido em coreano (igual ao original se estiver certo)", "notas": ["até 4 observações curtas em português de Portugal, cada uma a explicar um erro ou a dar uma dica"], "elogio": "uma frase curta em português"}`;
    return sample.json(prompt,{modelTier:"default"}).then(r=>{
      if(!r||(typeof r.correto!=="boolean"&&typeof r.corrigido!=="string"))throw {code:"bad"};
      bump("c");
      box.innerHTML=`<div class="fb ${r.correto?"ok":"no"}"><div><b>${r.correto?"Muito bem!":"Quase!"}</b> ${esc(r.elogio||"")}</div>
        ${r.corrigido&&norm(r.corrigido)!==norm(text)?`<div class="row"><span class="k grow">${esc(r.corrigido)}</span>${say(r.corrigido)}</div>`:""}
        ${Array.isArray(r.notas)&&r.notas.length?`<ul>${r.notas.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
        ${model?`<div class="muted">Modelo: <span class="ko">${esc(model)}</span></div>`:""}</div>`;
    });
  }).catch(e=>{box.innerHTML=`<div class="fb info" style="margin-bottom:8px">${sampleErr(e)} Fica a correção automática:</div>`+local()});
}

function genPassage(l){

  box.innerHTML=`<div class="fb info"><span><span class="spin"></span> A escrever um texto…</span></div>`; $("#gen").disabled=true;
  getSample().then(sample=>{
    if(!sample){box.innerHTML=`<div class="fb info">O Claude não está disponível aqui.</div>`;return}
    const prompt=`Escreve um texto curto de leitura para o 성취도 평가 (teste de fim de nível) do 세종학당, nível 세종한국어 2A.

Depois escreve 3 perguntas de escolha múltipla em coreano, no estilo do 성취도 평가 (ex.: "이 글의 내용과 같은 것을 고르십시오."), cada uma com 4 opções em coreano e só uma correta.
Responde só com JSON: {"titulo":"título curto em coreano","texto":"...","perguntas":[{"pergunta":"...","opcoes":["","","",""],"certa":0}]}`;
    return sample.json(prompt,{modelTier:"default",cache:false}).then(r=>{

const transcript=()=>CH.msgs.map(m=>(m.who==="me"?"Aluna: ":"Tu: ")+m.ko).join("\n");
function chatTurn(){
  CH.busy=true;CH.error=null;renderChat();
  const sc=CH.sc;
  getSample().then(sample=>{
    if(!sample)throw {code:"none"};
    const prompt=`Estás numa conversa de prática de coreano. Fazes de ${sc[3]}. Situação: ${sc[2]}

${CH.msgs.length?"Conversa até agora:\n"+transcript():"Começa tu a conversa."}
Responde só com JSON: {"ko":"a tua próxima fala em coreano","pt":"tradução em português de Portugal"}`;
    return sample.json(prompt,{modelTier:"default",cache:false}).then(r=>{

    if(!sample)throw {code:"none"};

      if(!r||(!Array.isArray(r.erros)&&!r.elogio))throw {code:"bad"};

        ${r.dica?`<div class="rev"><b>Dica:</b> ${esc(r.dica)}</div>`:""}</div>

      renderChat(); const cn=$("#cnew"); if(cn)cn.onclick=()=>{CH={sc,msgs:[],busy:false,showPt:CH.showPt};chatTurn()};
    });

const QRE=/^q:[gdsphtnomck]/;
const HTYPE={place:"Onde estão",topic:"Tema da conversa",act:"O que vai fazer",why:"Razão",same:"Conteúdo igual"};
const ORAL_T={p:"Pergunta pessoal",d:"Descrever uma imagem",r:"Roleplay",a:"Dar um conselho"};
function qById(id){
  const t=id[0], n=+id.slice(1);
  if(t==="g"){const g=GAPS[n];if(!g)return null;return {id,sec:"r",type:"Gramática (빈칸)",l:g[0],stem:"다음 (　)에 들어갈 가장 알맞은 것을 고르십시오.",sentence:g[1],opts:g[2],expl:g[3],t:30}}
  if(t==="d"){const d=DIALOGS[n];if(!d)return null;return {id,sec:"l",type:"Resposta adequada",l:d[0],stem:"다음을 듣고 이어지는 말로 가장 알맞은 것을 고르십시오.",audio:d[1],opts:d[2],expl:"Ouviste: "+d[1],t:45}}
  if(t==="h"){const h=LDLG[n];if(!h)return null;return {id,sec:"l",type:HTYPE[h.k],l:h.les||0,stem:"다음을 듣고 물음에 답하십시오. "+h.s,lines:h.l,opts:h.o,expl:linesText(h.l),t:45}}
  if(t==="s"){const s=SENT[n];if(!s)return null;const others=shuffle(SENT.filter(x=>x!==s)).slice(0,3).map(x=>x[1]);
    return {id,sec:"l",type:"Frase ouvida",l:s[2],stem:"다음을 듣고 들은 내용과 같은 것을 고르십시오.",audio:s[0],opts:[s[1],...others],pt:true,expl:"Ouviste: "+s[0],t:45}}
  if(t==="p"){const m=id.match(/^p(\d+)-(\d+)$/);const p=m&&PASSAGES[+m[1]];const q=p&&p.q[+m[2]];if(!q)return null;
    return {id,sec:"r",type:"Texto e perguntas",l:p.l,stem:q[0],passage:p.x,opts:q[1],t:60}}
  if(t==="t"){const x=RTOPIC[n];if(!x)return null;return {id,sec:"r",type:"Tema do texto",l:x[0],stem:"무엇에 대한 이야기입니까? 알맞은 것을 고르십시오.",passage:x[1],opts:x[2],t:30}}
  if(t==="n"){const x=NOTICE[n];if(!x)return null;return {id,sec:"r",type:"Avisos e anúncios",l:x.les,stem:"다음을 읽고 맞지 않는 것을 고르십시오.",notice:x,opts:x.o,t:60}}
  if(t==="o"){const x=ORDER[n];if(!x)return null;return {id,sec:"r",type:"Ordem das frases",l:x.les,stem:"다음을 순서대로 맞게 나열한 것을 고르십시오.",passage:x.s.join("\n"),opts:x.o,t:60}}
  if(t==="m"){const x=RMAIN[n];if(!x)return null;return {id,sec:"r",type:"Ideia principal (ler)",l:x.les,stem:"다음을 읽고 중심 생각을 고르십시오.",passage:x.x,opts:x.o,t:60}}
  if(t==="c"){const x=LMAIN[n];if(!x)return null;return {id,sec:"l",type:"Ideia principal (ouvir)",l:x.les,stem:`다음을 듣고 ${x.who}의 중심 생각을 고르십시오.`,lines:x.l,opts:x.o,expl:linesText(x.l),t:45}}
  if(t==="k"){const m=id.match(/^k(\d+)-(\d+)$/);const x=m&&LLONG[+m[1]];const q=x&&x.q[+m[2]];if(!q)return null;
    return {id,sec:"l",type:"Diálogo longo",l:x.les,stem:"다음을 듣고 물음에 답하십시오. "+q[0],lines:x.l,opts:q[1],expl:linesText(x.l),t:60}}
  if(t==="w"){const m=id.match(/^w(\w+)-(\d+)$/);const T=m&&WTASK[m[1]];const it=T&&T.items[+m[2]];if(!it)return null;return {id,sec:"w",type:T.n,task:m[1],item:it}}
  if(t==="z"){const o=ORAL[n];if(!o)return null;return {id,sec:"s",type:ORAL_T[o[0]],oral:o}}
  return null;
}
const KIND={full4:"Exame completo",L:"Exame de 듣기",R:"Exame de 읽기",W:"Exame de 쓰기",S:"Exame de 말하기",mini:"Mini-exame"};
function buildExam(kind){
  const N=(arr,n)=>shuffle(arr).slice(0,n);
  const ids=(arr,p)=>arr.map((_,i)=>p+i);
  const H=k=>LDLG.map((h,i)=>h.k===k?"h"+i:null).filter(Boolean);
  // Same order of question types as TOPIK I: answers, place, topic, content, main idea, reasons, long dialogue.
  const Lq=()=>{const k=N(LLONG.map((_,i)=>i),1)[0];return [...N(ids(DIALOGS,"d"),6),...N(H("place"),4),...N(H("topic"),3),...N(H("same"),4),...N(ids(LMAIN,"c"),3),...N(H("act"),1),...N(H("why"),2),"k"+k+"-0","k"+k+"-1"]};
  const Rq=()=>{const ps=N(PASSAGES.map((_,i)=>i),3);return [...N(ids(RTOPIC,"t"),3),...N(ids(GAPS,"g"),10),...N(ids(NOTICE,"n"),2),...N(ids(ORDER,"o"),2),...N(ids(RMAIN,"m"),2),...ps.flatMap(i=>["p"+i+"-0","p"+i+"-1"])]};
  const Wq=()=>Object.keys(WTASK).map(T=>"w"+T+"-"+(Math.random()*WTASK[T].items.length|0));
  const Sq=()=>{const by=t=>shuffle(ORAL.map((o,i)=>o[0]===t?"z"+i:null).filter(Boolean));return [...by("p").slice(0,2),by("d")[0],by("r")[0],by("a")[0]]};
  let L;
  if(kind==="full4")L=[...Lq(),...Rq(),...Wq(),...Sq()];
  else if(kind==="L")L=Lq(); else if(kind==="R")L=Rq(); else if(kind==="W")L=Wq(); else if(kind==="S")L=Sq();
  else {const ps=N(PASSAGES.map((_,i)=>i),1);
    L=[...shuffle([...N(ids(DIALOGS,"d"),3),...N(ids(LDLG,"h"),4),...N(ids(SENT,"s"),3)]),...N(ids(GAPS,"g"),4),...N(ids(RTOPIC,"t"),1),...N(ids(NOTICE,"n"),1),...N(ids(ORDER,"o"),1),...N(ids(RMAIN,"m"),1),...ps.flatMap(i=>["p"+i+"-0","p"+i+"-1"])]}
  return L.map(qById).filter(Boolean);
}

    </div>`);
  ["full4","L","R","W","S","mini"].forEach(k=>{$("#ex-"+k).onclick=()=>startExam(buildExam(k),"exam",k)});

function startExam(qs,mode,kind){
  EX={qs:qs.map(q=>({...q,order:shuffle([0,1,2,3])})),i:0,ans:[],mode,kind:kind||"mini",timer:null,dl:{},live:true};
  renderQ();
}
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const blockOf=q=>q.sec==="w"?"w":q.sec==="s"?"s":"lr";
const blockMin=b=>b==="w"&&EX.kind!=="mini"?20:b==="lr"?(EX.kind==="full4"?50:EX.kind==="L"||EX.kind==="R"?25:0):0;
const SECN={l:"듣기",r:"읽기",w:"쓰기",s:"말하기"};
function renderQ(){
  clearInterval(EX.timer); if(hasTTS())speechSynthesis.cancel();
  const q=EX.qs[EX.i]; if(!q){examEnd();return}
  const n=EX.qs.length, review=EX.mode==="review", blk=blockOf(q);
  if(!review&&blockMin(blk)&&!EX.dl[blk])EX.dl[blk]=Date.now()+blockMin(blk)*60e3;
  const dl=review?0:EX.dl[blk]||0;
  const same=EX.qs.filter(x=>x.sec===q.sec), secN=same.indexOf(q)+1;
  const head=`<div class="row"><button class="btn ghost" id="quit">Sair</button><div class="grow"></div>${dl?`<span class="score" id="gt" style="color:var(--red)">${mmss(dl-Date.now())}</span>`:""}<span class="muted score">${EX.i+1}/${n}</span></div>
    <div class="progress c-cobalt"><div class="bar"><i style="width:${EX.i/n*100}%"></i></div></div>`;
  const tag=`<span class="sec ${q.sec}">${SECN[q.sec]} ${secN}/${same.length}</span>`;
  const next=()=>{clearInterval(EX.timer);EX.i++;renderQ()};
  const nextBlock=()=>{let j=EX.i;while(j<n&&blockOf(EX.qs[j])===blk)j++;EX.i=j;renderQ()};
  const bindCommon=()=>{
    $("#quit").onclick=()=>{clearInterval(EX.timer);EX.live=false;if(hasTTS())speechSynthesis.cancel();exame()};
    if(dl)EX.timer=setInterval(()=>{const left=dl-Date.now();const gt=$("#gt");if(gt)gt.textContent=mmss(left);
      if(left<=0){clearInterval(EX.timer);toast("Acabou o tempo desta parte.");nextBlock()}},1000);

async function gradeOpen(W,Sp){
  const out={};
  let sample=null; try{sample=await getSample()}catch(e){}
  const auto=()=>{out.w=W.length?W.map(r=>autoGrade(r.a,{range:WRANGE[r.q.task]})):null;out.s=Sp.length?Sp.map(r=>autoGrade(r.a,{range:[1,3],model:r.q.oral[3]})):null};
  if(!sample){auto();out.err="Sem o Claude, as notas de 쓰기 e 말하기 são automáticas e aproximadas: a app verifica tamanho, gramática, partículas e terminações.";return out}
  const ask=async(list,kind)=>{
    if(!list.length)return null;
    const items=list.map((r,i)=>kind==="w"
      ?`${i+1}. Tipo: ${r.q.type}. Enunciado: ${r.q.item.join(" | ")}\nResposta: """${(r.a||"").trim()||"(sem resposta)"}"""`
      :`${i+1}. Pergunta: ${r.q.oral[1]} (${r.q.oral[2]}). Resposta-modelo: ${r.q.oral[3]}\nTranscrição do reconhecimento de voz: """${(r.a||"").trim()||"(sem resposta)"}"""`).join("\n\n");
    const intro=kind==="w"
      ?"És examinador da parte de 쓰기 do 성취도 평가 do 세종학당 (nível 2A, exigência semelhante ao TOPIK I). Avalia cada resposta de uma aluna portuguesa de 0 a 100: cumpre a tarefa, gramática, vocabulário e ortografia."
      :"És examinador da parte de 말하기 do 성취도 평가 do 세종학당 (nível 2A). A aluna respondeu em voz alta; o texto é o que o reconhecimento de voz percebeu, por isso palavras trocadas podem indicar problemas de pronúncia. Avalia cada resposta de 0 a 100: responde à pergunta, gramática e vocabulário de 2A, pronúncia.";
    const r=await sample.json(`${intro} Resposta vazia = 0.\n\n${items}\n\nResponde só com JSON: {"itens":[{"nota":número,"comentario":"uma frase curta em português de Portugal com o erro principal ou um elogio"}]} com ${list.length} itens, pela mesma ordem.`,{modelTier:"default",cache:false});
    return list.map((_,i)=>{const it=r&&Array.isArray(r.itens)&&r.itens[i]||{};return hasNota(it)?{nota:Math.max(0,Math.min(100,Math.round(+it.nota))),comentario:String(it.comentario||"")}:null});
  };
  try{out.w=await ask(W,"w");out.s=await ask(Sp,"s")}catch(e){auto();out.err=sampleErr(e)+" Ficam notas automáticas e aproximadas para 쓰기 e 말하기."}
  return out;
}

function showResult(res,g){
  const mini=EX.kind==="mini";
  const part=sec=>{const rs=res.filter(r=>r.q.sec===sec);return rs.length?rs:null};
  const pct=rs=>Math.round(rs.filter(r=>r.ok).length/rs.length*100);
  const avg=a=>{const v=(a||[]).filter(Boolean);return v.length?Math.round(v.reduce((s,x)=>s+x.nota,0)/v.length):null};
  const P=[];
  if(part("l"))P.push({k:"l",n:"듣기",s:pct(part("l"))});
  if(part("r"))P.push({k:"r",n:"읽기",s:pct(part("r"))});
  if(part("w"))P.push({k:"w",n:"쓰기",s:avg(g.w)});
  if(part("s"))P.push({k:"s",n:"말하기",s:avg(g.s)});
  const scored=P.filter(p=>p.s!==null);
  const mc=res.filter(r=>r.q.sec==="l"||r.q.sec==="r");
  mc.forEach(r=>{if(r.a!==undefined||!mini)r.ok?errOk("q:"+r.q.id):errAdd("q:"+r.q.id)});
  const noScore=!mini&&!scored.length, partial=!mini&&scored.length>0&&scored.length<P.length;
  const pts=mini?mc.filter(r=>r.ok).length*5:(scored.length?Math.round(scored.reduce((a,p)=>a+p.s,0)/scored.length):0);
  if(!noScore){hist.push({d:today(),s:pts,full:EX.kind==="full4"&&!partial}); hist=hist.slice(-20)} bump("r");
  const wk=store.get("weak",{}); if(!isObj(wk.les))wk.les={}; if(!isObj(wk.type))wk.type={};
  mc.forEach(r=>{(wk.type[r.q.type]=wk.type[r.q.type]||[0,0])[1]++;if(r.ok)wk.type[r.q.type][0]++;
    if(r.q.l){(wk.les[r.q.l]=wk.les[r.q.l]||[0,0])[1]++;if(r.ok)wk.les[r.q.l][0]++}});
  store.set("weak",wk);
  const weakest=scored.length>1?scored.reduce((a,b)=>b.s<a.s?b:a):(scored.length===1&&scored[0].s<70?scored[0]:null);
  const pass=pts>=60, wrong=mc.filter(r=>!r.ok);
  const W=res.filter(r=>r.q.sec==="w"), Sp=res.filter(r=>r.q.sec==="s");
  const orow=(r,ev)=>`<div class="rev"><span class="muted">${esc(r.q.type)}${r.q.oral?" · "+esc(r.q.oral[1]):""}</span><span class="ko">${esc((r.a||"").trim()||"(sem resposta)")}</span>${ev?`<span><b>${ev.nota}</b> · ${esc(ev.comentario)}</span>`:""}</div>`;
  V(`<div class="card result"><div class="eyebrow">${KIND[EX.kind]||"Exame"}</div><div class="pts" style="${pass||noScore?"":"color:var(--ochre)"}">${noScore?"–":pts}</div>
      <div class="muted">${noScore?"Sem nota: esta parte é corrigida pelo Claude"
        :`${mini?"pontos em 100":partial?"média de "+scored.map(p=>p.n).join(" e ")+" (o resto ficou sem nota)":"média em 100"} · ${pass?"acima dos 60 para passar":"abaixo dos 60 para passar"}`}</div>
      ${P.length>1||!mini?`<div class="skills">${P.map(p=>`<div class="sk${weakest&&p===weakest?" weak":""}"><span class="ko">${p.n}</span><div class="bar"><i style="width:${p.s??0}%"></i></div><b>${p.s??"–"}</b></div>`).join("")}</div>`:""}</div>
    ${g.err?`<div class="fb info">${esc(g.err)}</div>`:""}
    ${focusHTML(mc,weakest)}
    ${W.length||Sp.length?`<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>쓰기 e 말하기</h2>${W.map((r,i)=>orow(r,g.w&&g.w[i])).join("")}${Sp.map((r,i)=>orow(r,g.s&&g.s[i])).join("")}</div>`:""}
    ${wrong.length?`<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Para rever (${wrong.length})</h2>
      ${wrong.map(r=>`<div class="rev"><span class="muted">${esc(r.q.sentence||r.q.expl||r.q.stem)}</span>
        <span>Certa: <span class="ko">${esc(r.q.opts[0])}</span></span>
        ${r.a==null?'<span class="muted">Sem resposta</span>':`<span class="muted">Escolheste: ${esc(r.q.opts[r.a])}</span>`}
        ${r.q.sentence&&r.q.expl?`<span class="muted">${esc(r.q.expl)}</span>`:""}</div>`).join("")}</div>`:mc.length?`<div class="fb ok">Tudo certo na escolha múltipla! 완벽해요!</div>`:""}
    <div class="row"><button class="btn ghost grow" id="bk">Voltar</button><button class="btn grow" id="again">Outro exame</button></div>`);
  $("#bk").onclick=exame; const kind=EX.kind; $("#again").onclick=()=>startExam(buildExam(kind),"exam",kind);

      <div style="font-size:14px">O exame baseia-se no áudio do manual 2A, que é gratuito no <b>누리-세종학당</b> (site e app oficiais). Para treinar o formato, há o simulado <b>평가 연습하기</b> da SKA.</div>
      <a class="btn ghost" href="https://ska.ksif.or.kr" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Abrir o simulado SKA ↗</a></div>
    ${VIDEOS.map(g=>`<section class="view" style="gap:8px"><h2>${esc(g.g)}</h2>
      ${g.items.map(v=>`<div class="tq"><div class="r${seen[v[4]]?" done":""}"><button class="chk" data-v="${v[4]}" aria-label="Marcar como visto">✓</button>
        <a href="https://www.youtube.com/watch?v=${v[4]}" target="_blank" rel="noopener"><span style="flex:1;min-width:0"><b class="d" style="font-size:14px">${esc(v[0])}</b><br><span class="muted" style="font-size:12px">${esc(v[1])} · ${v[2]} · ${v[3]} · ${esc(v[5])}</span></span><span style="color:var(--jade);font-size:20px">↗</span></a></div></div>`).join("")}</section>`).join("")}
    <p class="muted" style="font-size:13px;margin:0">Dica: vê primeiro com legendas em coreano e depois sem legendas.</p>`;
  $$("[data-v]").forEach(b=>b.onclick=()=>{const s=store.get("seen",{});s[b.dataset.v]=!s[b.dataset.v];store.set("seen",s);videos()});
}

/* ============ 말하기 (oral de exame + conversa) ============ */
function conversa(){
  S.cmode=S.cmode||"oral";
  if(S.scen!==null&&S.cmode==="chat"){renderChat();return}
  $("#pbody").innerHTML=`<div class="seg"><button aria-pressed="${S.cmode==="oral"}" data-cm="oral">Exame oral</button><button aria-pressed="${S.cmode==="chat"}" data-cm="chat">Conversa</button></div><div id="cbody" class="view"></div>`;
  $$("[data-cm]").forEach(b=>b.onclick=()=>{S.cmode=b.dataset.cm;S.scen=null;OR=null;conversa()});
  if(S.cmode==="oral"){oral();return}
  $("#cbody").innerHTML=`<p class="muted" style="margin:0">Escolhe uma situação. O Claude faz de outra pessoa e conversa contigo em coreano simples. No fim, corrige o que escreveste.</p>
    <div class="list">${SCEN.map((s,i)=>`<button class="scen" data-s="${i}"><b>${lname(s[0])} · ${esc(s[1])}</b><span>Com ${esc(s[3])} · ${esc(s[4])}</span></button>`).join("")}</div>`;
  $$("[data-s]").forEach(b=>b.onclick=()=>{S.scen=+b.dataset.s;CH={sc:SCEN[S.scen],msgs:[],busy:false,showPt:false};renderChat();chatTurn()});
}
let OR=null;
function oral(){
  if(!OR){
    $("#cbody").innerHTML=`<div class="card pad" style="display:flex;flex-direction:column;gap:10px">
        <b>Simulação do 말하기</b>
        <div style="font-size:14px">5 perguntas, como no exame: 2 pessoais, 1 imagem, 1 roleplay e 1 conselho. Ouves a pergunta, tens 10 segundos para pensar e 40 para responder <b>em voz alta</b>. Depois vês uma resposta-modelo.</div>
        <div class="muted" style="font-size:13px">Dica: grava-te com o gravador do telemóvel para te ouvires depois.</div>
        <button class="btn" id="os">Começar</button></div>`;
    $("#os").onclick=()=>{const by=t=>shuffle(ORAL.filter(o=>o[0]===t));OR={qs:[...by("p").slice(0,2),by("d")[0],by("r")[0],by("a")[0]],i:0,phase:"prep"};oralQ()};
    return;
  }
  oralQ();
}
function oralQ(){
  clearInterval(EX.timer);
  const q=OR.qs[OR.i];
  if(!q){bump("c");$("#cbody").innerHTML=`<div class="card result"><div class="ko" style="font-size:36px;font-weight:700;color:var(--jade)">수고했어요!</div><div class="muted">Terminaste as 5 perguntas.</div></div><button class="btn" id="oa">Outra simulação</button>`;$("#oa").onclick=()=>{OR=null;oral()};return}
  const tipo=ORAL_T[q[0]];
  $("#cbody").innerHTML=`<div class="row"><span class="muted grow">${OR.i+1}/5 · ${tipo}</span><button class="btn ghost" id="ox">Sair</button></div>
    <div class="card pad c-cobalt" style="display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center">
      <button class="icon lg" data-say="${esc(q[1])}" aria-label="Ouvir pergunta">${SPK}</button>
      <div class="sentence">${esc(q[1])}</div>
      <div class="muted" style="font-size:14px">${esc(q[2])}</div>
      <div class="ko" id="oc" style="font-size:40px;font-weight:700;font-variant-numeric:tabular-nums"></div>
      <div class="muted" id="ol" style="font-size:13px"></div>${rateCtl()}</div>
    ${answerBox("oi")}
    <button class="btn" id="od">Já respondi</button>
    <div id="om" class="view"></div>`;
  $("#ox").onclick=()=>{clearInterval(EX.timer);OR=null;oral()};
  speak(q[1]);
  let left=10, phase="prep"; const oc=$("#oc"), ol=$("#ol");
  const tick=()=>{oc.textContent=left;ol.textContent=phase==="prep"?"Pensa…":"Fala agora!";oc.style.color=phase==="prep"?"var(--muted)":"var(--red)"};
  const showModel=()=>{clearInterval(EX.timer);oc.textContent="";ol.textContent="";$("#od").hidden=true;
    $("#om").innerHTML=`<div class="fb info"><div class="muted">Resposta-modelo</div><div class="row"><span class="k grow">${esc(q[3])}</span>${say(q[3])}</div>${pronHTML(q[3])}</div>
      <div class="row"><button class="btn ghost grow" id="of">Avaliar a minha resposta</button><button class="btn grow" id="on">${OR.i<4?"Seguinte →":"Terminar"}</button></div><div id="ofb"></div>`;
    $("#on").onclick=()=>{OR.i++;oralQ()};
    const evalNow=()=>{const t=$("#oi").value.trim();if(!t){$("#oi").focus();toast("Escreve ou dita a tua resposta na caixa para a app avaliar.");return}oralEval($("#ofb"),q,t)};
    $("#of").onclick=evalNow;
    if($("#oi").value.trim())evalNow();
  };
  $("#od").onclick=showModel;
  tick();
  EX.timer=setInterval(()=>{left--;if(left<=0){if(phase==="prep"){phase="talk";left=40}else{showModel();return}}tick()},1000);
}

route();
</script>
